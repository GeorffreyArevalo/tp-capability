spring:
  application:
    name: capability

  r2dbc:
    url: r2dbc:postgresql://localhost:5433/capability
    username: postgres
    password: 1234

  flyway:
    enabled: true
    locations: classpath:db/migration
    url: jdbc:postgresql://localhost:5433/capability
    user: postgres
    password: 1234

server:
  port: 8081

springdoc:
  swagger-ui:
    path: "/api/doc/capability/swagger-ui.html"
  api-docs:
    path: "/api/doc/capability/api-docs"

routes:
  paths:
    capabilities: "/api/v1/capabilities"



adapter:
  clients:
    timeout: 5000
    clients:
      tech:
        base-url: "http://localhost:8080/api/v1"